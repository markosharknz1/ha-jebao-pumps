set_schedule_slot:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: jebao_local
    slot:
      required: true
      selector:
        number:
          min: 0
          max: 47
          mode: box
    start_hour:
      required: true
      selector:
        number:
          min: 0
          max: 24
          mode: box
    start_minute:
      required: true
      selector:
        number:
          min: 0
          max: 59
          mode: box
    end_hour:
      required: true
      selector:
        number:
          min: 0
          max: 24
          mode: box
    end_minute:
      required: true
      selector:
        number:
          min: 0
          max: 59
          mode: box
    mode:
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
    flow:
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
    frequency:
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box
    # Which of these three a product actually uses depends on its slot
    # layout (see jebao_gizwits/schedule.py) - the others are ignored.
    pulse_tide:
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box
    feed_time:
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box
    cust_wave_freq:
      required: false
      selector:
        number:
          min: 0
          max: 255
          mode: box

clear_schedule_slot:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: jebao_local
    slot:
      required: true
      selector:
        number:
          min: 0
          max: 47
          mode: box

sync_clock:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: jebao_local
