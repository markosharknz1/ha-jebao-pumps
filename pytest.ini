; Pins how the async tests run so a local pass means a CI pass.
;
; pytest-asyncio's default mode has changed across releases, and in
; "auto" vs "strict" the same suite can pass in one place and fail in
; another. The suite marks every async test with @pytest.mark.asyncio,
; which is exactly what strict mode expects, so say so rather than
; inheriting whatever the installed version happens to default to.
[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
