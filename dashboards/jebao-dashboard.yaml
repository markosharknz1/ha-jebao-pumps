# Jebao Pumps — Lovelace dashboard
# ---------------------------------------------------------------------------
# HOW TO USE
#   Settings → Dashboards → Add dashboard → (open it) → top-right ⋮ →
#   Edit dashboard → ⋮ → Raw configuration editor → paste this in.
#
#   Nothing else to install - the native card (custom:jebao-pump-card) and
#   the Control panel below are both bundled inside the jebao_local
#   integration itself and register themselves automatically (as a Lovelace
#   resource and a static path respectively) the moment the integration
#   loads, whether you installed it via HACS or by copying
#   custom_components/jebao_local/ by hand. No "Settings > Dashboards >
#   Resources" step, no separate www/ folder to manage.
#
# ADAPT IT
#   * Group your pumps into tanks by editing the sections/views below.
#   * Each card is `type: custom:jebao-pump-card` with an optional `dids:`
#     list scoping it to specific pumps - omit `dids` entirely and a card
#     shows every jebao_local pump HA knows about (handy for a quick
#     one-card overview, see the bottom of the Overview view below).
#   * The card reads each pump's own entities to decide what to show - a
#     dosing pump with no Feed mode/Wave mode just won't render those rows,
#     no configuration needed on your part.
#   * <did> is the pump's device id (lowercased) - find it in any of its
#     entity_ids (Developer Tools → States, filter "jebao_" is fastest, or
#     Settings → Devices & Services → Devices → the pump → click any
#     entity). It's also shown directly in the config-flow discovery list
#     when you first add the pump. The example did below
#     (qp50gpt5i8h4mfkio0enik) is a real pump from this project's own
#     testing - replace it with yours.
# ---------------------------------------------------------------------------
title: Jebao Pumps
views:
  # ---- OVERVIEW: tanks as sections, a native card per tank ----
  - title: Overview
    path: overview
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Display tank
            heading_style: title
            icon: mdi:fishbowl
          - type: custom:jebao-pump-card
            dids: ["qp50gpt5i8h4mfkio0enik"]
          # Quick actions for the whole tank (see jebao-tank-scripts.yaml):
          - type: entities
            title: Display tank actions
            entities:
              - entity: script.display_tank_all_on
                name: All pumps on
                icon: mdi:power
              - entity: script.display_tank_all_off
                name: All pumps off
                icon: mdi:power-off
              - entity: script.display_tank_feed_now
                name: Feed now (with timer)
                icon: mdi:food-drumstick

      # ---- Add more tanks by copying a grid section like this. A card
      # with several dids stacks all of them in one card - one per tank
      # works well; use a separate card per pump instead if you want them
      # individually reorderable. ----
      - type: grid
        cards:
          - type: heading
            heading: Frag tank (example — edit dids)
            heading_style: title
            icon: mdi:fishbowl-outline
          - type: custom:jebao-pump-card
            dids: ["00000001", "00000002"]

      # ---- Everything at once, no dids needed - useful as a fast overview
      # while you're still deciding how to group tanks. ----
      - type: grid
        cards:
          - type: heading
            heading: All pumps
            heading_style: title
            icon: mdi:view-grid
          - type: custom:jebao-pump-card

  # ---- CONTROL PANEL (tank groups, settings profiles, clone-to-tank,
  # feed timer - a separate multi-pump management tool, complementary to
  # the per-tank cards above) ----
  - title: Control panel
    path: control
    icon: mdi:tune
    cards:
      - type: iframe
        url: /jebao_local/designer.html
        aspect_ratio: 120%
