# Per-tank scripts for Jebao pumps
# ---------------------------------------------------------------------------
# Put these under `script:` in configuration.yaml (or a packages file), then
# reload scripts. They chain a whole tank's pumps together: one tap turns
# them all on/off, or runs feed mode with an auto-off timer that keeps
# working even if the Control panel page isn't open (unlike the designer's
# own client-side countdown - see custom_components/jebao_local/panel/
# designer.html's note).
#
# Two entity_id patterns show up below, and which one your pump uses
# depends on whether it has a single clear speed attribute (Flow, or
# Motor_Speed on other product lines):
#   - fan.jebao_<did>_fan            - on/off AND speed together (fan.py)
#   - switch.jebao_<did>_<attr>      - on/off only, no speed control
# The native `custom:jebao-pump-card` figures this out for you automatically
# (see the main dashboard file); these scripts can't ask the pump what it
# has, so pick whichever pattern matches yours - see jebao-dashboard.yaml's
# header comment for how to find a pump's did either way. The example below
# uses a real pump from this project's own testing (qp50gpt5i8h4mfkio0enik,
# which does have a fan entity - Flow is its speed).
# ---------------------------------------------------------------------------

display_tank_all_on:
  alias: Display tank — all on
  icon: mdi:power
  sequence:
    - action: fan.turn_on
      target:
        entity_id:
          - fan.jebao_qp50gpt5i8h4mfkio0enik_fan

display_tank_all_off:
  alias: Display tank — all off
  icon: mdi:power-off
  sequence:
    - action: fan.turn_off
      target:
        entity_id:
          - fan.jebao_qp50gpt5i8h4mfkio0enik_fan

display_tank_feed_now:
  alias: Display tank — feed now
  icon: mdi:food-drumstick
  sequence:
    # FeedSwitch/FeedTime are always plain switch/number entities regardless
    # of whether the pump also has a fan entity - feed mode isn't a "speed".
    # Uses whatever duration is currently set on each pump's Feed duration
    # number entity (falls back to 5 minutes if it can't be read). Set it
    # first with number.set_value if you want a different duration than
    # what's already there.
    - action: switch.turn_on
      target:
        entity_id:
          - switch.jebao_qp50gpt5i8h4mfkio0enik_feedswitch
    - delay:
        minutes: "{{ states('number.jebao_qp50gpt5i8h4mfkio0enik_feedtime') | int(5) }}"
    - action: switch.turn_off
      target:
        entity_id:
          - switch.jebao_qp50gpt5i8h4mfkio0enik_feedswitch

display_tank_apply_storm_profile:
  alias: Display tank — apply Storm profile
  icon: mdi:weather-windy
  sequence:
    # Build profiles like this in the Control panel's Profile tab (Save
    # profile), then copy the mode/flow/frequency values from its Export
    # tab here for a one-tap automation trigger.
    - action: select.select_option
      target:
        entity_id:
          - select.jebao_qp50gpt5i8h4mfkio0enik_mode
      data:
        option: "随机造浪"  # Random wave
    - action: fan.set_percentage
      target:
        entity_id:
          - fan.jebao_qp50gpt5i8h4mfkio0enik_fan
      data:
        percentage: 90
    - action: number.set_value
      target:
        entity_id:
          - number.jebao_qp50gpt5i8h4mfkio0enik_frequency
      data:
        value: 80

